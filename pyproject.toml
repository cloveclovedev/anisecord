[project]
name = "anisecord"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "discord-py>=2.6.2",
    "fastapi[standard]>=0.116.1",
    "httpx>=0.28.1",
    "litellm>=1.76.1",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
